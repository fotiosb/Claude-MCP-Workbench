# limit_req_zone must live in http{} (e.g. /etc/nginx/conf.d/mcpwb-limit.conf),
# NOT inside a server{} block. If zone "mcpwb" already exists on this server, omit
# the duplicate — nginx will fail with "duplicate limit_req_zone".
# limit_req_zone $binary_remote_addr zone=mcpwb:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.fotios.org;

    root /opt/mcp-workbench/web/dist;
    index index.html;

    client_max_body_size 8k;

    limit_req zone=mcpwb burst=20 nodelay;

    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/runs/*/events): keep upstream connection reusable and unbuffered.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
